plugins {
    // Minecraft 26.1+ is unobfuscated: use the non-remapping Loom plugin.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Automatic dotted date version (yy.MM.dd, e.g. 26.04.27). JVM default timezone at configure time.
def autoModVersion = java.time.LocalDate.now().format(
        java.time.format.DateTimeFormatter.ofPattern('yy.MM.dd'))
version = autoModVersion
project.ext.mod_version = autoModVersion

group = project.mod_group_id

base {
    archivesName = project.mod_id
}

loom {
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    var replaceProperties = [
        minecraft_version: project.minecraft_version,
        loader_version   : project.loader_version,
        mod_id           : project.mod_id,
        mod_name         : project.mod_name,
        mod_license      : project.mod_license,
        mod_version      : project.mod_version,
        mod_description  : project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.mod_id}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
